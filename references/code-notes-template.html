:root{--bg:#fbfaf7;--paper:#ffffff;--ink:#1f2328;--muted:#636c76;--line:#e4e1da;--accent:#b4532a;--accent-soft:#f6e7df;--code:#f4f2ee;--mark:#fff3b0}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 80px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px}
.toc{position:sticky;top:24px;align-self:start;font-size:14px}
.toc p{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.08em}
.toc a{display:block;padding:4px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none}
.toc a:hover{color:var(--accent);border-color:var(--accent)}
.notes{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 52px;min-width:0}
.note-head{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:8px}
.kicker{margin:0;color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.12em}
h1{font-size:28px;line-height:1.35;margin:6px 0 10px}
.meta{margin:0;color:var(--muted);font-size:14px}
h2{font-size:21px;margin:42px 0 14px;padding-top:6px;scroll-margin-top:20px}
h3{font-size:17px;margin:26px 0 10px}
a{color:var(--accent)}
p,ul,ol{margin:10px 0}
li{margin:3px 0}
strong{font-weight:650}
mark{background:var(--mark);color:inherit;padding:0 2px}
code{font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:.88em;background:var(--code);padding:1px 5px;border-radius:4px}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.55}
pre code{background:none;padding:0;font-size:13.5px}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600;white-space:nowrap}
img{max-width:100%;max-height:560px;width:auto;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
figure{margin:18px 0;text-align:center}
figcaption{color:var(--muted);font-size:13.5px;margin-top:6px}
blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.note-sec:empty::after,.empty{color:var(--muted);font-style:italic}
.qa li{margin:12px 0}
details{margin:12px 0;border:1px solid var(--line);border-radius:8px;padding:8px 14px}
summary{cursor:pointer;color:var(--muted)}
.foot{margin-top:48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:20px 16px 60px;gap:16px}.toc{position:static;display:flex;flex-wrap:wrap;gap:4px}.toc p{width:100%}.toc a{border:1px solid var(--line);border-radius:999px;padding:2px 10px}.notes{padding:24px 18px}}
@media print{body{background:#fff}.toc{display:none}.wrap{display:block;padding:0}.notes{border:none;padding:0}h2{break-after:avoid}figure,pre,table{break-inside:avoid}}
</style>
